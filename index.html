<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120b2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bloom Chain</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <!-- HOME -->
  <section id="home" class="screen">
    <div class="home-top">
      <button class="pill coins" data-act="shop"><span class="ico">🪙</span><b data-bind="coins">0</b><i>+</i></button>
      <button class="round" data-act="settings" aria-label="Settings">⚙</button>
    </div>
    <div class="logo">
      <div class="logo-orbs"><i></i><i></i><i></i></div>
      <h1>BLOOM<br><span>CHAIN</span></h1>
      <p class="tagline">One tap. Endless chain reactions.</p>
    </div>
    <div class="home-actions">
      <button class="btn big play" data-act="play"><span>PLAY</span><small data-bind="levelLabel">Level 1</small></button>
      <button class="btn daily" data-act="daily"><span class="ico">📅</span><span><b>Daily Challenge</b><small data-bind="dailyLabel"></small></span><i class="dot" data-bind="dailyDot"></i></button>
      <div class="home-row">
        <button class="btn sec" data-act="shop"><span class="ico">🛒</span>Shop</button>
        <button class="btn sec" data-act="skins"><span class="ico">🎨</span>Skins</button>
        <button class="btn sec" data-act="reward"><span class="ico">🎁</span>Gift<i class="dot" data-bind="giftDot"></i></button>
      </div>
    </div>
  </section>

  <!-- HUD -->
  <section id="hud" class="screen hidden">
    <div class="hud-top">
      <button class="round" data-act="home" aria-label="Home">⌂</button>
      <div class="hud-title"><b data-bind="hudTitle">Level 1</b><small data-bind="hudWorld"></small></div>
      <button class="pill coins" data-act="shop"><span class="ico">🪙</span><b data-bind="coins">0</b></button>
    </div>
    <div class="taps"><div class="taps-n" data-bind="taps">0</div><div class="taps-l">TAPS LEFT</div><div class="par" data-bind="par"></div></div>
    <div id="tip" class="tip hidden"></div>
    <div class="bar">
      <button class="pu" data-act="pu-hint"><span class="ico">💡</span><b>Hint</b><i class="badge" data-bind="hints">0</i></button>
      <button class="pu" data-act="pu-undo"><span class="ico">↩</span><b>Undo</b><i class="badge" data-bind="undos">0</i></button>
      <button class="pu" data-act="pu-taps"><span class="ico">➕</span><b>+2 Taps</b><i class="badge cost">🪙60</i></button>
      <button class="pu" data-act="pu-retry"><span class="ico">↻</span><b>Restart</b></button>
    </div>
  </section>

  <div id="modal-root"></div>
  <div id="toast" class="toast hidden"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
